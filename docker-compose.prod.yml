# docker compose --env-file .env.local -f docker-compose.prod.yml up -d --build
# docker compose -f docker-compose.prod.yml logs -f site

services:
  db:
    image: postgres:17
    env_file: .env.local
    volumes:
      - prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugs"]
      interval: 2s
      retries: 15
    networks:
      - app-network

  site:
    build: .
    container_name: site
    env_file: .env.local
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_volume:/app/uploads
    healthcheck:
      test: curl --fail -s http://localhost:3000
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - app-network

  uploads_server:
    image: nginx:alpine
    container_name: uploads-nginx
    volumes:
      - uploads_volume:/usr/share/nginx/html/uploads:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

  reverse_proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - 3000:80
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - site
      - uploads_server
    networks:
      - app-network

volumes:
  prod_data:
  uploads_volume:

networks:
  app-network:
    driver: bridge